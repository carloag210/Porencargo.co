<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva contraseña</title>
    <link rel="stylesheet" href="/assets/css/login_register.css">
</head>

<body>

<main>
<div class="auth-container">

    <form class="form-container recovery-card" method="POST">

        <div class="lock-circle">🔐</div>

        <h1>Nueva contraseña</h1>

        <div class="gradient-line"></div>

        <p class="subtitulo">
            Crea una contraseña segura para proteger tu cuenta de <strong>PorEncargo.co</strong>.
        </p>

        <label>Nueva contraseña</label>

<div class="input-password">
    <span class="icon-left">🔒</span>

    <input
        type="password"
        name="password"
        id="password"
        placeholder="Mínimo 8 caracteres"
        required>

    <button type="button"
            class="toggle-eye"
            onclick="togglePassword('password', this)">
        👁️
    </button>
</div>

<!-- Barra de fortaleza -->
<div class="strength-container">

    <div class="strength-header">
        <span>Fortaleza</span>
        <span id="strength-label">Muy débil</span>
    </div>

    <div class="strength-bar">
        <div id="strength-fill"></div>
    </div>

    <small id="strength-tip">
        Usa al menos 8 caracteres, un número y un símbolo.
    </small>

</div>

<label>Confirmar contraseña</label>

        <div class="input-password">
            <span class="icon-left">✔</span>

            <input
                type="password"
                id="confirm_password"
                placeholder="Repite la contraseña"
                required>

            <button type="button" class="toggle-eye" onclick="togglePassword('confirm_password', this)">
                👁️
            </button>
        </div>

        <div id="password-status" class="password-status">
            <span id="status-icon">○</span>
            <span id="status-text">Esperando confirmación…</span>
        </div>

        <button class="btn-recovery" type="submit">
            Guardar contraseña
        </button>

        <div class="security-box">
            <div class="shield">🛡</div>
            <div>
                <strong>Consejo de seguridad</strong>
                <p>Utiliza letras, números y un símbolo para una contraseña más segura.</p>
            </div>
        </div>

    </form>

</div>
</main>

<script>
const form = document.querySelector("form");
const pass = document.getElementById("password");
const confirmPass = document.getElementById("confirm_password");

const strengthFill = document.getElementById("strength-fill");
const strengthLabel = document.getElementById("strength-label");
const strengthTip = document.getElementById("strength-tip");

const status = document.getElementById("password-status");
const icon = document.getElementById("status-icon");
const text = document.getElementById("status-text");

function evaluarFortaleza(){

    const value = pass.value;
    let score = 0;

    if(value.length >= 8) score++;
    if(/[A-Z]/.test(value)) score++;
    if(/[0-9]/.test(value)) score++;
    if(/[^A-Za-z0-9]/.test(value)) score++;

    if(value.length === 0){
        strengthFill.style.width = "0%";
        strengthFill.style.background = "#334155";
        strengthLabel.innerHTML = "Muy débil";
        strengthTip.innerHTML = "Usa al menos 8 caracteres.";
        return;
    }

    if(score <= 1){
        strengthFill.style.width = "25%";
        strengthFill.style.background = "#EF4444";
        strengthLabel.innerHTML = "Débil";
        strengthTip.innerHTML = "Agrega números y un símbolo.";
    }
    else if(score == 2){
        strengthFill.style.width = "55%";
        strengthFill.style.background = "#F59E0B";
        strengthLabel.innerHTML = "Media";
        strengthTip.innerHTML = "Añade una mayúscula.";
    }
    else if(score == 3){
        strengthFill.style.width = "80%";
        strengthFill.style.background = "#0EA5E9";
        strengthLabel.innerHTML = "Buena";
        strengthTip.innerHTML = "Muy segura.";
    }
    else{
        strengthFill.style.width = "100%";
        strengthFill.style.background = "#22C55E";
        strengthLabel.innerHTML = "Fuerte";
        strengthTip.innerHTML = "Excelente contraseña.";
    }
}

function validarPassword(){

    if(confirmPass.value === ""){
        status.className = "password-status";
        icon.innerHTML = "○";
        text.innerHTML = "Esperando confirmación…";
        return;
    }

    if(pass.value === confirmPass.value){
        status.className = "password-status ok";
        icon.innerHTML = "✓";
        text.innerHTML = "Las contraseñas coinciden";
    }else{
        status.className = "password-status error";
        icon.innerHTML = "✕";
        text.innerHTML = "Las contraseñas no coinciden";
    }
}

pass.addEventListener("input", () => {
    evaluarFortaleza();
    validarPassword();
});

confirmPass.addEventListener("input", validarPassword);

form.addEventListener("submit", function(e){

    if(pass.value !== confirmPass.value){
        e.preventDefault();
        validarPassword();
        confirmPass.focus();
    }

});

function togglePassword(id, btn){

    const input = document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
        btn.innerHTML = "🙈";
    }else{
        input.type = "password";
        btn.innerHTML = "👁️";
    }

}
</script>

</body>
</html>
